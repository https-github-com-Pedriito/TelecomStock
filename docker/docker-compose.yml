
services:
  db:
    image: postgres:14
    container_name: telecomstock_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: telecomstock
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - telecomstock_network

  ollama:
    image: ollama/ollama:latest
    container_name: telecomstock_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - telecomstock_network
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  pgadmin:
    image: dpage/pgadmin4
    container_name: telecomstock_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - telecomstock_network
    volumes:
      - ./servers.json:/pgadmin4/servers.json

networks:
  telecomstock_network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
