
services:
  db:
    image: postgres:14
    container_name: telecomstock_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: telecomstock
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - telecomstock_network

  ollama:
    image: ollama/ollama:latest
    container_name: telecomstock_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - telecomstock_network
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  api:
    build: 
      context: ../api
      dockerfile: Dockerfile
    container_name: telecomstock_api
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=telecomstock
      - JWT_SECRET=votre_secret_jwt_super_secure
      # AI Provider Configuration
      - AI_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=phi3:3.8b
      - API_PORT=3443
    ports:
      - "0.0.0.0:3443:3443"  # HTTPS
      - "0.0.0.0:3080:3080"  # HTTP pour développement mobile
    depends_on:
      - db
      - ollama
    networks:
      - telecomstock_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../api:/usr/src/app
      - /usr/src/app/node_modules

  pgadmin:
    image: dpage/pgadmin4
    container_name: telecomstock_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - telecomstock_network
    volumes:
      - ./servers.json:/pgadmin4/servers.json

  nginx:
    image: nginx:1.25-alpine
    container_name: telecomstock_nginx
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    # Attendre que Vite soit prêt avant de démarrer Nginx
    entrypoint: /wait-for-vite.sh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Script d'attente de Vite
      - ./wait-for-vite.sh:/wait-for-vite.sh:ro
      # Nginx virtual host configuration
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Static webroot served by Nginx (built by the 'frontend' service)
      - frontend_dist:/usr/share/nginx/html:ro
      # Development certificates generated by mkcert (mapped to standard Nginx paths)
      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    networks:
      - telecomstock_network

  frontend:
    image: node:18-alpine
    container_name: telecomstock_frontend
    working_dir: /app
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api
    volumes:
      # Bind the project root into the container to access source and package.json
      - ..:/app
      # Output built assets into a named volume shared with Nginx
      - frontend_dist:/output
      - /app/node_modules  # Prevent node_modules from being overwritten
    # DEV MODE: Run Vite dev server without cert manager
    command: sh -c "apk add --no-cache wget && npm install && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"  # Expose Vite dev server
    # Healthcheck disabled for dev mode
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-check-certificate --no-verbose --tries=1 --spider https://localhost:5173 || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 10s
    networks:
      - telecomstock_network

networks:
  telecomstock_network:
    driver: bridge

volumes:
  postgres_data:
  frontend_dist:
  ollama_data:
