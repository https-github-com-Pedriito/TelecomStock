# Nginx reverse proxy optimized for fast dev reloads

# Map Upgrade header for websockets
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Upstream pour le frontend (keep-alive activé)
upstream frontend_dev {
  server telecomstock_frontend:5173;
  keepalive 64;  # Garde 64 connexions ouvertes vers Vite
}

# Upstream pour l'API (keep-alive activé)
upstream api_backend {
  server telecomstock_api:3080;
  keepalive 32;  # Garde 32 connexions ouvertes vers l'API
}

# Redirect all HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name localhost 127.0.0.1 192.168.1.49;

  # Optional: serve ACME http-01 challenges if using Certbot with webroot
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server optimized for dev
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name localhost 127.0.0.1 192.168.1.49;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  
  # TLS optimizations for faster handshakes
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;  # Évite des lenteurs/alertes en dev
  # Pas de OCSP stapling en dev (évite les timeouts)

  # Security headers (basic set) - PAS DE HSTS en dev !
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: ws: wss:" always;
  
  # Network optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;

  # Proxy settings to backend API (listening inside Docker network)
  location /api/ {
    # forward everything under /api to the API container's HTTP port
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # IMPORTANT: Keep-alive côté upstream
    proxy_set_header Connection "";
    
    # Extended timeouts for AI assistant (up to 2 minutes)
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Buffering pour réduire les TTFB hachés
    proxy_buffering on;
    proxy_buffers 32 4k;
    
    # Pas de cache pour l'API en dev
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    add_header Expires "0" always;
  }

  # Serve frontend if built as static files (optional)
  # In DEV mode: proxy to Vite dev server with Hot Module Reload
  location / {
    proxy_pass https://frontend_dev;
    proxy_http_version 1.1;
    
    # WebSocket/HMR support (CRITICAL)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Headers standards
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # IMPORTANT: Keep-alive côté upstream pour Vite
    # Ne PAS utiliser "Connection: close" ou "$connection_upgrade" ici
    # On laisse Nginx gérer la connexion persistent
    
    # WebSocket support for HMR (Hot Module Replacement)
    proxy_read_timeout 86400;
    proxy_send_timeout 300s;
    
    # SSL verification - accept self-signed certs from Vite
    proxy_ssl_verify off;
    
    # Buffering pour HMR
    proxy_buffering on;
    proxy_buffers 32 4k;
    
    # Cache minimal en dev (0 pour forcer le revalidate)
    add_header Cache-Control "private, max-age=0, must-revalidate" always;
  }
  
  # PRODUCTION mode: Serve SPA build; fallback to index.html for client-side routing
  # Uncomment below and comment the proxy above for production
  # root /usr/share/nginx/html;
  # location / {
  #   try_files $uri $uri/ /index.html;
  # }
}

