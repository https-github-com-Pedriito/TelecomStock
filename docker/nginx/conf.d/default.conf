# Nginx reverse proxy terminating TLS and proxying to the API

# Map Upgrade header for websockets
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Redirect all HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name localhost 127.0.0.1 192.168.1.49;

  # Optional: serve ACME http-01 challenges if using Certbot with webroot
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name localhost 127.0.0.1 192.168.1.49;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Security headers (basic set)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: ws: wss:" always;

  # Proxy settings to backend API (listening inside Docker network)
  location /api/ {
    # forward everything under /api to the API container's HTTP port
    proxy_pass http://telecomstock_api:3080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Extended timeouts for AI assistant (up to 2 minutes)
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # Serve frontend if built as static files (optional)
  # In DEV mode: proxy to Vite dev server with Hot Module Reload
  location / {
    proxy_pass https://telecomstock_frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support for HMR (Hot Module Replacement)
    proxy_read_timeout 86400;
    
    # SSL verification - accept self-signed certs from Vite
    proxy_ssl_verify off;
  }
  
  # PRODUCTION mode: Serve SPA build; fallback to index.html for client-side routing
  # Uncomment below and comment the proxy above for production
  # root /usr/share/nginx/html;
  # location / {
  #   try_files $uri $uri/ /index.html;
  # }
}

