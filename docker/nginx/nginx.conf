# Nginx configuration optimized for fast dev server

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;  # Performance Linux
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    # Keep-alive settings (CRITICAL pour éviter reconnexions TLS)
    keepalive_timeout  65s;
    keepalive_requests 1000;
    
    # Reduce timeouts for faster error detection
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    
    # Buffer sizes (optimized for dev)
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Output buffering
    output_buffers 2 32k;
    postpone_output 1460;
    
    # Compression (pour assets non-HMR)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_disable "msie6";
    
    # Proxy cache path (optional pour assets statiques)
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dev_cache:10m max_size=100m inactive=60m;

    include /etc/nginx/conf.d/*.conf;
}
