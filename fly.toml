# Fichier de configuration pour Fly.io
app = "telecomstock-api"
primary_region = "cdg" # Paris

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    restart_limit = 0

  [[services.http_checks]]
    interval = "30s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 0

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Définir les secrets avec: fly secrets set KEY=VALUE
# Requis:
# - DB_HOST
# - DB_PORT
# - DB_USER
# - DB_PASSWORD
# - DB_NAME
# - JWT_SECRET
# Optionnels:
# - AI_PROVIDER (ollama ou openai)
# - OLLAMA_HOST
# - OLLAMA_MODEL
# - OPENAI_API_KEY
