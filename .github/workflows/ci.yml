name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci_dummy_secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PRICE_PRO: price_pro_dummy
      STRIPE_PRICE_BUSINESS: price_business_dummy
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Dependency audit (high/critical only)
        run: npm audit --audit-level=critical

      - name: Secret scan (new commits only)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          SHA="${{ github.sha }}"
          DEFAUT="origin/${{ github.event.repository.default_branch }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            RANGE="${{ github.event.before }}..$SHA"
          elif git rev-parse --verify --quiet "$DEFAUT" >/dev/null 2>&1 && [ "$(git rev-parse "$DEFAUT")" != "$SHA" ]; then
            # Branche nouvellement poussee : `before` vaut 0000..., et un RANGE
            # reduit a "$SHA" ferait scanner TOUT l'historique — `git log <sha>`
            # signifie « ce commit et tous ses ancetres ». Le scan butait alors
            # sur des fuites anciennes et echouait sur chaque nouvelle branche.
            # On ne regarde que les commits absents de la branche par defaut.
            RANGE="$DEFAUT..$SHA"
          elif git rev-parse --verify --quiet "$SHA^" >/dev/null 2>&1; then
            RANGE="$SHA^..$SHA"
          else
            RANGE="$SHA"  # tout premier commit du depot : pas de parent
          fi
          echo "Plage scannee : $RANGE"
          ./gitleaks detect --source . --log-opts="$RANGE" --redact -v

      - name: Build
        run: npm run build
